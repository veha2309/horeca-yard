services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: horeca
      POSTGRES_USER: horeca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - horeca-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U horeca -d horeca']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  horeca-postgres:
